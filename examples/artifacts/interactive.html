<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker concurrency model</title>
<style>
:root{color-scheme:light dark}body{max-width:760px;margin:64px auto;padding:0 24px;font:18px/1.6 system-ui}h1{font-size:2.2em;line-height:1.2;letter-spacing:-.04em}.panel{padding:28px;border:1px solid #75869a55;border-radius:16px}input{width:100%;accent-color:#0f766e}output{font-size:3em;font-weight:650}p{opacity:.75}code{font-size:.9em}
</style></head><body><h1>Small tool. Useful leverage.</h1><p>A self-contained interactive artifact. No CDN libraries, external images, or network calls.</p>
<section class="panel"><label for="workers">Concurrent workers: <strong id="count">4</strong></label><input type="range" id="workers" min="1" max="16" value="4"><p>Illustrative throughput at 12 tasks per worker:</p><output id="throughput">48</output><span> tasks / hour</span></section>
<p>Published with <code>xbt publish interactive.html</code>.</p>
<script>const slider=document.getElementById('workers');slider.addEventListener('input',()=>{document.getElementById('count').textContent=slider.value;document.getElementById('throughput').textContent=String(Number(slider.value)*12);});</script>
</body></html>
