name: Release
on:
  push:
    tags: ['v*']
  # Select the existing tag as the workflow ref when recovering a failed release.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exhibit-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require tag event/ref
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm release:validate --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/exhibit-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exhibit-release
          path: ${{ runner.temp }}/exhibit-release/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: validate
    if: ${{ vars.NPM_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
      NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exhibit-release
          path: ${{ runner.temp }}/exhibit-release/
      - name: Publish exact validated archive with npm OIDC
        run: node tools/release/publish.ts "$RUNNER_TEMP/exhibit-release"
      - name: Create or recover GitHub Release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/exhibit-release"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$output/release-notes.md"
            gh release upload "$RELEASE_TAG" "$output"/*.tgz "$output/SHA256SUMS" --clobber
          else
            gh release create "$RELEASE_TAG" "$output"/*.tgz "$output/SHA256SUMS" \
              --verify-tag --title "Release $RELEASE_TAG" --notes-file "$output/release-notes.md"
          fi
