name: Release
on:
  push:
    tags: ['v*']
  # Select the existing tag as the workflow ref when recovering a failed release.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exhibit-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require tag event/ref
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm release:validate --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/exhibit-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exhibit-release
          path: ${{ runner.temp }}/exhibit-release/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: validate
    if: ${{ vars.NPM_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
      NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exhibit-release
          path: ${{ runner.temp }}/exhibit-release/
      - name: Publish exact validated archive with npm OIDC
        run: node tools/release/publish.ts "$RUNNER_TEMP/exhibit-release"
      - name: Create or recover GitHub Release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/exhibit-release"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$output/release-notes.md"
            gh release upload "$RELEASE_TAG" "$output"/*.tgz "$output/SHA256SUMS" --clobber
          else
            gh release create "$RELEASE_TAG" "$output"/*.tgz "$output/SHA256SUMS" \
              --verify-tag --title "Release $RELEASE_TAG" --notes-file "$output/release-notes.md"
          fi
